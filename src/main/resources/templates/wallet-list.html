<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>钱包管理</title><link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"><style>body{font-family:"Microsoft YaHei",Arial,sans-serif;color:#303744;background:#f5f6f8;padding:20px;font-size:14px}h2{font-size:20px;font-weight:600;margin:0 0 20px}#search{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:16px 20px;background:#fff;border:1px solid #e7e9ed;border-radius:6px;padding:20px 24px}#search label{display:flex;flex-direction:column;gap:8px;margin:0;color:#697586;font-size:13px;font-weight:400}input{width:100%;min-width:0;border:1px solid #d6dce4;border-radius:4px;padding:8px 10px;height:36px;color:#303744;background:#fff}input:focus{outline:none;border-color:#66afe9;box-shadow:0 0 0 2px #337ab71a}.search-actions{grid-column:1/-1;display:flex;gap:10px;align-items:center}.btn{border-radius:4px;padding:8px 19px;font-size:14px}.read-tip{color:#87909b;font-size:12px;margin:12px 2px 20px}.table-wrap{overflow-x:auto}.table{background:#fff;border:1px solid #e7e9ed;margin:0 0 18px;font-size:13px}.table th{background:#f0f3f7;color:#5b6572;font-weight:600;white-space:nowrap}.table td,.table th{padding:13px 16px!important;vertical-align:middle!important}.table td:nth-child(4){font-family:Consolas,monospace;font-size:12px;white-space:nowrap}.table td:nth-child(5),.table th:nth-child(5){text-align:right;font-variant-numeric:tabular-nums}.table td:nth-child(6),.table th:nth-child(6),.table td:last-child,.table th:last-child{text-align:center}.table tbody tr:hover{background:#f7faff}.status-normal{color:#237a49;background:#edf8f1;padding:3px 10px;border-radius:12px}.status-lost{color:#a76612;background:#fff5e5;padding:3px 10px;border-radius:12px}.recharge-link{color:#337ab7;display:inline-block;padding:4px 10px;border:1px solid #c9dced;border-radius:4px}.recharge-link:hover{background:#eef6ff;text-decoration:none}.pagination-bar{display:flex;justify-content:flex-end;align-items:center;gap:12px}.pagination-bar button{border:1px solid #d6dce4;border-radius:4px;background:#fff;padding:7px 14px;font-size:13px}.pagination-bar button:disabled{opacity:.45;cursor:not-allowed}#count{font-size:13px;color:#697586}#msg{color:#a33}.empty-row{text-align:center!important;color:#87909b;padding:30px!important}@media(max-width:1100px){#search{grid-template-columns:repeat(2,minmax(140px,1fr))}}@media(max-width:560px){body{padding:12px}#search{grid-template-columns:1fr;padding:16px}.pagination-bar{justify-content:center;flex-wrap:wrap}}.wallet-actions{display:flex;justify-content:center;align-items:center;gap:8px;white-space:nowrap}.wallet-action{display:inline-block;background:#fff;border:1px solid #c9dced;border-radius:4px;padding:4px 10px;font-size:13px;line-height:1.42857143}.loss-action{color:#a76612;border-color:#ead4b3}.restore-action{color:#237a49;border-color:#c3dfcc}.wallet-action:disabled{opacity:.4;cursor:not-allowed}.recharge-link{font-size:13px;line-height:1.42857143} </style></head><body><h2>钱包管理</h2><div th:if="${finance}"><form id="search"><label>姓名<input name="name" placeholder="请输入姓名，支持模糊查询"></label><label>学工号<input name="student" placeholder="请输入完整学工号"></label><label>身份证号<input name="identity" placeholder="请输入完整身份证号" autocomplete="off"></label><label>一卡通卡号<input name="card" id="card" placeholder="请输入或读取卡号"></label><div class="search-actions"><button class="btn btn-primary">查询</button><button type="button" class="btn btn-default" onclick="readCard()">读卡查询</button><button type="reset" class="btn btn-default">重置</button></div></form><p class="read-tip">点击“读卡查询”后刷卡，或输入卡号后查询。</p><div class="table-wrap"><table class="table"><thead><tr><th>姓名</th><th>学工号</th><th>身份证号</th><th>有效卡号</th><th>余额（元）</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pagination-bar"><button id="prev" onclick="go(-1)">上一页</button> <span id="count"></span> <button id="next" onclick="go(1)">下一页</button></div></div><p th:unless="${finance}"><a th:href="@{/campus/wallet/detail/{id}(id=${selfId})}">我的钱包</a></p><p id="msg"></p><script th:src="@{/js/jquery.min.js}"></script><script th:inline="javascript">
var base=/*[[@{/campus/wallet}]]*/'',token=/*[[${token}]]*/'',canStatus=/*[[${canstatus}]]*/false,page=1,total=0;
function load(){var data=$('#search').serializeArray();data.push({name:'page',value:page});$.getJSON(base+'/search',data).done(function(d){total=d.total;$('#rows').empty();d.rows.forEach(function(r){var tr=$('<tr>');['user_name','student_no','identity_no','card_no','balance','status'].forEach(function(k){$('<td>').text(r[k]==null?'—':k==='status'?({ACTIVE:'正常',LOST:'挂失'}[r[k]]||'未知状态'):k==='balance'?Number(r[k]).toFixed(2):r[k]).each(function(){if(k==='status')$(this).wrapInner($('<span>').addClass(r[k]==='ACTIVE'?'status-normal':'status-lost'));}).appendTo(tr);});var cell=$('<td>'),actions=$('<div>').addClass('wallet-actions');$('<a>').attr('href',base+'/detail/'+r.user_id).addClass('recharge-link').text('充值').appendTo(actions);$('<button>').addClass('wallet-action loss-action').text('挂失').prop('disabled',!canStatus||r.status!=='ACTIVE').on('click',function(){changeStatus(r,'LOST',this);}).appendTo(actions);$('<button>').addClass('wallet-action restore-action').text('解挂').prop('disabled',!canStatus||r.status!=='LOST').on('click',function(){changeStatus(r,'ACTIVE',this);}).appendTo(actions);cell.append(actions).appendTo(tr);tr.appendTo('#rows');});if(!d.rows.length)$('<tr>').append($('<td>').attr('colspan',7).addClass('empty-row').text('暂无符合条件的钱包')).appendTo('#rows');$('#prev').prop('disabled',page<=1);$('#next').prop('disabled',page*20>=total);$('#count').text('第'+page+'页，共'+total+'个钱包');}).fail(function(){$('#msg').text('查询失败或没有管理权限');});}
function changeStatus(row,status,button){var name=status==='LOST'?'挂失':'解挂',tip=status==='LOST'?'挂失后禁止消费和划扣，仍可充值。':'解挂后恢复正常消费。';if(!confirm('确认'+name+' '+row.user_name+'（学工号：'+row.student_no+'）的钱包？\n'+tip))return;$(button).prop('disabled',true);$.post(base+'/status',{user:row.user_id,status:status,token:token}).done(function(){alert('钱包'+name+'成功');load();}).fail(function(x){alert(x.responseJSON&&x.responseJSON.error?x.responseJSON.error:'操作结果未确认，请刷新查询钱包状态');load();});}
$('#search').on('reset',function(){setTimeout(function(){page=1;load();},0);});
$('#search').on('submit',function(e){e.preventDefault();page=1;load();});function go(n){if(page+n<1||(n>0&&page*20>=total))return;page+=n;load();}function readCard(){$('#card').val('').focus();}window.CampusCardReader={onCard:function(number){$('#card').val(number);page=1;load();}};
if(document.getElementById('search'))load();
</script></body></html>
