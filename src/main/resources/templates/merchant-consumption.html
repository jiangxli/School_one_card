<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>商户消费</title><link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"><style>body{font-family:"Microsoft YaHei",Arial,sans-serif;background:#f5f6f8;color:#303744;padding:20px;font-size:14px}h2{font-size:20px;font-weight:600;margin:0 0 20px}h3{font-size:16px;font-weight:600;margin:22px 0 14px}.toolbar{display:flex;align-items:center;gap:16px;padding:18px 20px;background:#fff;border:1px solid #e7e9ed;border-radius:6px}.toolbar select{min-width:240px}.toolbar .btn{margin-left:auto}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:18px 0}.stat{padding:20px;background:#fff;border:1px solid #e7e9ed;border-radius:6px}.stat small{color:#87909b}.stat strong{display:block;font-size:25px;color:#2879b0;margin:8px 0}.stat p{font-size:12px;color:#697586;margin:0}.note{font-size:12px;color:#87909b;margin:12px 0}#filter{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 20px;padding:20px;background:white;border:1px solid #e7e9ed;border-radius:6px}label{display:flex;flex-direction:column;gap:7px;font-size:13px;color:#697586;font-weight:400;margin:0}input,select{min-width:0;border:1px solid #d6dce4;border-radius:4px;background:white;color:#303744;height:36px;padding:7px 10px;box-sizing:border-box}button,.btn{border-radius:4px;font-size:13px;padding:7px 18px;line-height:20px}button{border:1px solid #d6dce4;background:white}.filter-actions{grid-column:1/-1;display:flex;gap:10px;border-top:1px solid #eef0f3;padding-top:16px}.primary{background:#337ab7;color:white;border-color:#337ab7}.table-wrap{overflow-x:auto;margin-top:16px}.table{background:white;border:1px solid #e7e9ed;font-size:13px;margin:0}.table th{background:#f0f3f7;color:#5b6572;white-space:nowrap}.table td,.table th{padding:13px 16px!important;vertical-align:middle!important;white-space:nowrap}.table td:first-child{font:12px Consolas,monospace}.table td:nth-child(7),.table th:nth-child(7){text-align:right;font-variant-numeric:tabular-nums}.table tbody tr:hover{background:#f7faff}.pager{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:16px}.pager span{color:#697586;font-size:13px}button:disabled{opacity:.4;cursor:not-allowed}.filtered-summary{font-size:13px;margin-top:16px;color:#697586}dialog{border:0;border-radius:8px;padding:24px;max-width:540px;width:90vw;box-shadow:0 10px 40px #0003}dialog::backdrop{background:#0006}dialog h3{margin:0 0 18px}dialog label{margin-bottom:16px}.dialog-actions{display:flex;gap:10px;margin-top:20px}#result{white-space:pre-wrap;color:#237a49;margin-top:16px}@media(max-width:900px){#filter{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{gap:10px}.stat{padding:14px}.stat strong{font-size:21px}}@media(max-width:560px){.stats,#filter{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.toolbar .btn{margin:0}.toolbar select{min-width:0;width:100%}body{padding:12px}}</style></head><body><h2>商户消费</h2><div class="toolbar"><span>当前商户</span><select id="merchant"><option value="">全部经营商户</option></select><button class="btn btn-primary" id="payButton" th:if="${canpay}" onclick="openPay()" disabled>模拟消费</button></div><div class="stats"><div class="stat"><small>当日净收入（元）</small><strong id="dayNet">0.00</strong><p id="dayParts"></p></div><div class="stat"><small>当月净收入（元）</small><strong id="monthNet">0.00</strong><p id="monthParts"></p></div><div class="stat"><small>当年净收入（元）</small><strong id="yearNet">0.00</strong><p id="yearParts"></p></div></div><p class="note" id="scope">收入按北京时间及交易实际发生时间统计，净收入＝消费额－退款额，不代表已结算资金。顶部汇总仅随商户选择变化。</p><h3>消费与退款明细</h3><form id="filter"><label>起始日期<input type="date" name="start"></label><label>截止日期<input type="date" name="end"></label><label>学工号<input name="student" placeholder="请输入完整学工号"></label><label>手机号<input name="phone" placeholder="请输入完整手机号"></label><div class="filter-actions"><button class="primary">查询</button><button type="reset">重置</button></div></form><div class="filtered-summary" id="filteredSummary"></div><div class="table-wrap"><table class="table"><thead><tr><th>资金流水号</th><th>商户</th><th>姓名</th><th>学工号</th><th>手机号</th><th>类型</th><th>金额（元）</th><th>发生时间</th><th>原消费流水号</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><button id="prev" onclick="go(-1)">上一页</button><span id="count"></span><button id="next" onclick="go(1)">下一页</button></div><p id="result" role="status"></p><dialog id="payDialog"><h3>模拟商户消费</h3><p id="payMerchant"></p><form id="payForm"><label>消费人员学工号<input id="student" required maxlength="30" autocomplete="off"></label><label>消费金额（元）<input id="amount" type="number" min="0.01" max="100000" step="0.01" required></label><p class="note">提交后扣减对应钱包余额，并生成消费流水。挂失钱包、停用商户、余额不足时拒绝扣款。</p><div class="dialog-actions"><button class="primary" id="confirmPay">确认消费</button><button type="button" onclick="document.getElementById('payDialog').close()">取消</button></div></form></dialog><script th:src="@{/js/jquery.min.js}"></script><script th:inline="javascript">
var base=/*[[@{/campus/merchant/consumption}]]*/'',token=/*[[${token}]]*/'',page=1,total=0,pending=null,payMerchant=null,merchants={};
function money(v){return Number(v||0).toFixed(2);}function fail(x){alert(x.responseJSON&&x.responseJSON.error?x.responseJSON.error:'请求未确认，请查询流水或保留原参数重试');}
function load(){var q=$('#filter').serializeArray();q.push({name:'merchant',value:$('#merchant').val()},{name:'page',value:page});$.getJSON(base+'/data',q).done(function(d){total=d.total;['day','month','year'].forEach(function(k){$('#'+k+'Net').text(money(d[k].net));$('#'+k+'Parts').text('消费 '+money(d[k].income)+'　退款 '+money(d[k].refunds));});$('#filteredSummary').text('当前筛选：消费 '+money(d.summary.income)+' 元，退款 '+money(d.summary.refunds)+' 元，净收入 '+money(d.summary.net)+' 元');$('#rows').empty();d.rows.forEach(function(r){var tr=$('<tr>');[r.transaction_no,r.merchant_name_snapshot||'—',r.user_name,r.student_no,r.phonenumber||'—',r.kind==='PAY'?'消费':'退款',money(r.amount),r.created_at,r.original_no||'—'].forEach(function(v){$('<td>').text(v).appendTo(tr);});tr.appendTo('#rows');});if(!d.rows.length)$('<tr>').append($('<td>').attr('colspan',9).text('暂无符合条件的交易记录')).appendTo('#rows');$('#count').text('第'+page+'页，共'+total+'条');$('#prev').prop('disabled',page<=1);$('#next').prop('disabled',page*20>=total);}).fail(fail);}
$('#merchant').on('change',function(){page=1;var m=merchants[$(this).val()];$('#payButton').prop('disabled',!m||m.active!==1);load();});$('#filter').on('submit',function(e){e.preventDefault();page=1;load();}).on('reset',function(){setTimeout(function(){page=1;load();},0);});function go(n){if(page+n<1||(n>0&&page*20>=total))return;page+=n;load();}
function openPay(){if(pending){payMerchant=pending.merchant;$('#student').val(pending.student);$('#amount').val(pending.amount);}else{payMerchant=$('#merchant').val();$('#payForm')[0].reset();}if(!merchants[payMerchant]||merchants[payMerchant].active!==1){alert('请选择启用的经营商户');return;}$('#payMerchant').text('收款商户：'+merchants[payMerchant].name);document.getElementById('payDialog').showModal();}
$('#payForm').on('submit',function(e){e.preventDefault();var student=$('#student').val().trim(),amount=$('#amount').val();if(pending&&(pending.student!==student||pending.amount!==amount||pending.merchant!==payMerchant)){alert('上一请求尚未确认，请保持原商户、学工号和金额重试');return;}if(!pending){if(!confirm('商户：'+merchants[payMerchant].name+'\n学工号：'+student+'\n确认消费 '+amount+' 元？'))return;pending={merchant:payMerchant,student:student,amount:amount,key:Date.now().toString(16)+'-'+Math.random().toString(16).slice(2)+'-'+Math.random().toString(16).slice(2)};}$('#confirmPay').prop('disabled',true);$.post(base+'/pay',{merchant:pending.merchant,student:student,amount:amount,key:pending.key,token:token}).done(function(r){pending=null;document.getElementById('payDialog').close();$('#result').text('消费成功，资金流水号：'+r.transaction_no);load();}).fail(function(x){if(x.status===400)pending=null;fail(x);}).always(function(){$('#confirmPay').prop('disabled',false);});});
$.getJSON(base+'/merchants').done(function(rows){rows.forEach(function(m){merchants[m.id]=m;$('<option>').val(m.id).text(m.name+(m.active===1?'':'（已停用）')).appendTo('#merchant');});load();}).fail(fail);
</script></body></html>
