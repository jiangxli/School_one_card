<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>钱包详情</title><link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"><style>body{padding:24px}input,select{padding:7px;margin:5px}#person{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 30px;padding:22px 0;margin-bottom:18px;border-bottom:1px solid #e5e7eb;line-height:1.6}.person-field{min-width:0}.person-label{display:block;color:#777;font-size:13px;margin-bottom:4px}.person-value{display:block;color:#222;font-size:15px;overflow-wrap:anywhere}.person-balance .person-value{font-size:26px;font-weight:600;color:#2879b0}@media(max-width:900px){#person{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){#person{grid-template-columns:1fr}}td,th{padding:10px!important}#recharge{border:1px solid #ddd;padding:20px;margin:20px 0;max-width:650px}#message{white-space:pre-wrap}body{font-family:"Microsoft YaHei",Arial,sans-serif;color:#303744;background:#f5f6f8;padding:20px}#person{background:#fff;border:1px solid #e7e9ed;border-radius:6px;padding:22px 24px;gap:18px 24px;margin:0 0 16px;grid-template-columns:repeat(4,minmax(0,1fr))}.person-label{font-size:12px;color:#87909b}.person-value{font-size:14px}.person-balance .person-value{font-size:23px}.btn{border-radius:4px;padding:8px 19px;font-size:14px}h3{font-size:18px;font-weight:600;margin:26px 0 16px}#filter{display:flex;align-items:center;flex-wrap:wrap;gap:10px;background:#fff;padding:14px 16px;border:1px solid #e7e9ed;border-radius:6px}#filter label{font-size:13px;margin:0;font-weight:400;display:flex;align-items:center;gap:8px}input,select{border:1px solid #d6dce4;border-radius:4px;min-height:34px;margin:0;padding:6px 10px;background:#fff}button:not(.btn){border:1px solid #d6dce4;border-radius:4px;background:#fff;padding:7px 14px;font-size:13px}#filter button{background:#337ab7;color:white;border-color:#337ab7}.table{background:#fff;border:1px solid #e7e9ed;margin-top:16px;font-size:13px}.table th{background:#f0f3f7;color:#5b6572;font-weight:600;white-space:nowrap}.table td,.table th{padding:13px 16px!important;vertical-align:middle!important}.table td:first-child,.table td:nth-child(2){font-family:Consolas,monospace;font-size:12px;white-space:nowrap}.table td:nth-child(6),.table td:nth-child(7),.table th:nth-child(6),.table th:nth-child(7){text-align:right;font-variant-numeric:tabular-nums}.table tbody tr:hover{background:#f7faff}dialog{border:0;border-radius:8px;padding:24px;box-shadow:0 10px 40px #0003;max-width:620px}dialog::backdrop{background:#0006}#recharge{background:white;border-radius:6px}#count{font-size:13px;color:#697586;margin:0 10px}@media(max-width:1100px){#person{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){#person{grid-template-columns:1fr}body{padding:12px}} </style></head><body><div id="person" aria-live="polite">正在加载用户基本信息…</div><button th:if="${canrecharge}" class="btn btn-primary" onclick="beginRecharge()">充值</button> <button th:if="${candebit}" class="btn btn-warning" onclick="beginDebit()">划扣</button>
<dialog id="debitDialog"><h3>模拟划扣</h3><p id="debitPerson"></p><form id="debitForm"><label>划扣金额（元）<input id="debitAmount" type="number" min="0.01" max="100000" step="0.01" required></label><p>确认后从钱包余额扣减，生成“模拟划扣”消费流水。</p><button id="debitSubmit" class="btn btn-warning" type="submit">确认划扣</button><button type="button" onclick="document.getElementById('debitDialog').close()">取消</button><p id="debitError" role="alert"></p></form></dialog>
<dialog id="verificationDialog"><h3>补充充值校验信息</h3><p id="verifyPerson"></p><p>该人员尚未登记身份证号，请补齐后继续充值。仅校验信息格式，不代表实名认证或短信验证。</p><form id="verificationForm"><label>身份证号<input id="verifyIdentity" maxlength="18" required autocomplete="off"></label><br><label>手机号码<input id="verifyPhone" maxlength="11" required></label><br><button type="submit">保存并继续充值</button><button type="button" onclick="document.getElementById('verificationDialog').close()">取消</button><p id="verifyError" role="alert"></p></form></dialog>
<section id="recharge" hidden><h3>人工登记充值</h3><p id="confirmPerson"></p><p>本功能为财务人工确认的模拟入账，不调用外部支付平台。</p><form id="rechargeForm"><label>金额（元）<input id="amount" type="number" min="0.01" max="100000" step="0.01" required></label><button id="submit" class="btn btn-primary">确认充值</button><button type="button" onclick="$('#recharge').hide()">取消</button></form></section>
<h3>历史交易记录</h3><form id="filter"><select name="kind"><option value="">全部流水</option><option value="PAY">消费</option><option value="RECHARGE">充值</option><option value="REFUND">退款</option></select><label>起始日期<input type="date" name="start"></label><label>截止日期<input type="date" name="end"></label><select id="merchant" name="merchant"><option value="">全部商户</option></select><button>查询</button></form><table class="table"><thead><tr><th>一卡通订单号</th><th>资金流水号</th><th>类型</th><th>商户</th><th>时间</th><th>金额（元）</th><th>交易后余额</th><th>状态</th></tr></thead><tbody id="rows"></tbody></table><button onclick="go(-1)">上一页</button> <span id="count"></span> <button onclick="go(1)">下一页</button><p id="message" role="status"></p><script th:src="@{/js/jquery.min.js}"></script><script th:inline="javascript">
var base=/*[[@{/campus/wallet}]]*/'',user=/*[[${userId}]]*/0,token=/*[[${token}]]*/'',page=1,total=0,pending=null;
function warn(message,target){if(target)$(target).text(message);window.alert(message);}
function fail(x){warn(x.responseJSON&&x.responseJSON.error?x.responseJSON.error:'请求未确认，请保持原参数重试','#message');}
function person(){$.getJSON(base+'/person',{user:user}).done(function(p){$('#person').empty();[ ['姓名',p.user_name],['学工号',p.student_no],['身份证号',p.identity_no||'尚未登记'],['手机号',p.phonenumber],['有效卡号',p.card_no||'未绑定有效卡'],['余额',Number(p.balance).toFixed(2)+' 元'],['状态',({ACTIVE:'正常',LOST:'挂失'}[p.status]||p.status)],['开通时间',p.created_at]].forEach(function(v){var field=$('<div>').addClass('person-field');if(v[0]==='余额')field.addClass('person-balance');$('<span>').addClass('person-label').text(v[0]).appendTo(field);$('<span>').addClass('person-value').text(v[1]||'—').appendTo(field);field.appendTo('#person');});$('#confirmPerson').text('充值对象：'+p.user_name+'　学工号：'+p.student_no);}).fail(fail);}
function history(){var data=$('#filter').serializeArray();data.push({name:'user',value:user},{name:'page',value:page});$.getJSON(base+'/history',data).done(function(d){total=d.total;$('#rows').empty();d.rows.forEach(function(r){var tr=$('<tr>');['order_no','transaction_no','kind','merchant_name','created_at','amount','balance_after','transaction_status'].forEach(function(k){$('<td>').text(r[k]==null?'—':k==='kind'?({RECHARGE:'充值',PAY:'消费',REFUND:'退款'}[r[k]]||'其他交易'):k==='transaction_status'?({SUCCESS:'成功',FAILED:'失败',PENDING:'处理中',CLOSED:'已关闭'}[r[k]]||'未知状态'):(k==='amount'||k==='balance_after')?Number(r[k]).toFixed(2):r[k]).appendTo(tr);});tr.appendTo('#rows');});$('#count').text('第'+page+'页，共'+total+'条');}).fail(fail);}
$('#filter').on('submit',function(e){e.preventDefault();page=1;history();});function go(n){if(page+n<1||(n>0&&page*20>=total))return;page+=n;history();}
$('#rechargeForm').on('submit',function(e){e.preventDefault();var amount=$('#amount').val();if(pending&&pending.amount!==amount){warn('上一请求未确认，请恢复原金额重试','#message');return;}if(!pending){if(!confirm($('#confirmPerson').text()+'，确认充值 '+amount+' 元？'))return;pending={amount:amount,key:Date.now().toString(16)+'-'+Math.random().toString(16).slice(2)+'-'+Math.random().toString(16).slice(2)};}$('#submit').prop('disabled',true);$.post(base+'/trade',{user:user,kind:'RECHARGE',amount:amount,key:pending.key,token:token}).done(function(r){pending=null;$('#message').text('充值成功\n订单号：'+r.order_no+'\n流水号：'+r.transaction_no);$('#recharge').hide();person();page=1;history();}).fail(function(x){if(x.status===400)pending=null;fail(x);}).always(function(){$('#submit').prop('disabled',false);});});
function beginRecharge(){$.getJSON(base+'/person',{user:user}).done(function(p){if(!p.identity_no){$('#verifyPerson').text('姓名：'+p.user_name+'　学工号：'+p.student_no);$('#verifyPhone').val(p.phonenumber||'');$('#verifyIdentity').val('');$('#verifyError').text('');document.getElementById('verificationDialog').showModal();}else{$('#recharge').show();}}).fail(fail);}
$('#verificationForm').on('submit',function(e){e.preventDefault();var button=$(this).find('button[type=submit]');button.prop('disabled',true);$.post(base+'/verification',{user:user,identity:$('#verifyIdentity').val(),phone:$('#verifyPhone').val(),token:token}).done(function(){document.getElementById('verificationDialog').close();person();$('#recharge').show();}).fail(function(x){warn(x.responseJSON&&x.responseJSON.error?x.responseJSON.error:'保存失败，请重试','#verifyError');}).always(function(){button.prop('disabled',false);});});
var debitPending=null;
function beginDebit(){$.getJSON(base+'/person',{user:user}).done(function(p){$('#debitPerson').text('姓名：'+p.user_name+'　学工号：'+p.student_no+'　当前余额：'+Number(p.balance).toFixed(2)+' 元');$('#debitError').text('');if(!debitPending)$('#debitAmount').val('');document.getElementById('debitDialog').showModal();}).fail(fail);}
$('#debitForm').on('submit',function(e){e.preventDefault();var amount=$('#debitAmount').val();if(debitPending&&debitPending.amount!==amount){warn('上次请求尚未确认，请保持原金额重试','#debitError');return;}if(!debitPending){if(!confirm($('#debitPerson').text()+'，确认划扣 '+amount+' 元？'))return;debitPending={amount:amount,key:Date.now().toString(16)+'-'+Math.random().toString(16).slice(2)+'-'+Math.random().toString(16).slice(2)};}$('#debitSubmit').prop('disabled',true);$.post(base+'/debit',{user:user,amount:amount,key:debitPending.key,token:token}).done(function(r){debitPending=null;document.getElementById('debitDialog').close();$('#message').text('划扣成功，流水号：'+r.transaction_no);person();page=1;history();}).fail(function(x){if(x.status===400)debitPending=null;warn(x.responseJSON&&x.responseJSON.error?x.responseJSON.error:'结果未确认，请保持原金额重试','#debitError');}).always(function(){$('#debitSubmit').prop('disabled',false);});});
$.getJSON(base+'/data',{user:user}).done(function(d){d.merchants.forEach(function(m){$('<option>').val(m.id).text(m.name).appendTo('#merchant');});});person();history();
</script></body></html>
