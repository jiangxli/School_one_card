<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>权限管理</title><link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"><style>body{font-family:"Microsoft YaHei",Arial,sans-serif;background:#f5f6f8;color:#303744;padding:20px;font-size:14px}h2{font-size:20px;font-weight:600;margin:0 0 20px}h3{font-size:16px;font-weight:600}.workspace{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px}.panel{background:white;border:1px solid #e7e9ed;border-radius:6px;padding:18px;margin:0}.heading,.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.heading{justify-content:space-between;margin-bottom:16px}.heading h3{margin:0}.role-item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #edf0f4;border-radius:0;padding:14px 10px;background:white}.role-item.selected{background:#eef6ff;color:#2879b0}.role-item small{display:block;color:#87909b;font-size:12px;margin-top:5px}button{border:1px solid #d6dce4;border-radius:4px;background:white;padding:7px 14px;font-size:13px;line-height:20px}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#337ab7;color:white;border-color:#337ab7}.tabs{display:flex;gap:24px;border-bottom:1px solid #e7e9ed;margin-bottom:18px}.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;padding:10px 0;color:#697586}.tabs button.selected{color:#337ab7;font-weight:600;border-bottom-color:#337ab7}.muted{font-size:12px;color:#87909b;line-height:1.7}.tree{border:1px solid #e7e9ed;border-radius:4px;max-height:65vh;overflow:auto;padding:14px;margin:16px 0}.tree label{font-size:13px;font-weight:400;display:flex;gap:9px;align-items:center;margin:0;padding:7px 8px;border-bottom:1px solid #f3f5f7}.tree input{margin:0;width:15px;height:15px}.node-action{color:#697586}.node-menu{font-weight:600!important}.tag{font-size:11px;color:#87909b}.table{background:#fff;border:1px solid #e7e9ed;font-size:13px;margin:16px 0}.table th{background:#f0f3f7;color:#5b6572;white-space:nowrap}.table td,.table th{padding:12px!important;vertical-align:middle!important}.table td input{width:16px;height:16px}.table-wrap{overflow:auto}input:not([type=checkbox]),select,textarea{border:1px solid #d6dce4;border-radius:4px;background:white;padding:7px 10px;min-height:36px;font-size:13px;color:#303744}input[type=checkbox]{accent-color:#337ab7}.pager{display:flex;justify-content:flex-end;align-items:center;gap:12px;color:#697586}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.fields label{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:400;color:#697586}.wide{grid-column:1/-1}dialog{border:0;border-radius:8px;padding:24px;width:min(620px,92vw);max-height:85vh;overflow:auto;box-shadow:0 10px 40px #0003}dialog::backdrop{background:#0006}.dialog-actions{display:flex;gap:10px;margin-top:20px}#bindingRoles label{display:block;padding:10px;border-bottom:1px solid #e7e9ed;font-weight:400}#audit details{padding:12px 0;border-bottom:1px solid #e7e9ed}pre{white-space:pre-wrap;font-size:12px}#roleTitle{font-size:16px;margin:0}#roleInfo{margin:5px 0 14px}@media(max-width:900px){.workspace{grid-template-columns:1fr}#roles{display:flex;overflow:auto}.role-item{min-width:180px}.fields{grid-template-columns:1fr}}</style></head><body><h2>权限管理</h2><div class="workspace"><aside class="panel"><div class="heading"><h3>角色管理</h3><button th:if="${canRole}" onclick="editRole()">新增</button></div><div id="roles"></div></aside><main class="panel"><div class="heading"><div><h3 id="roleTitle">请选择角色</h3><p id="roleInfo" class="muted"></p></div><button th:if="${canRole}" id="editRoleButton" onclick="editRole(selected)" disabled>维护角色</button></div><nav class="tabs"><button class="selected" id="grantTab" onclick="tab('grant')">菜单与操作授权</button><button th:if="${canAssign}" id="userTab" onclick="tab('user')">用户绑定与批量分配</button><button id="auditTab" onclick="tab('audit')">授权记录</button></nav><section id="grantPanel"><p class="muted">勾选角色可访问的菜单及菜单下的操作。角色拥有多个权限时取并集；用户绑定多个角色时取有效角色的权限并集。保存后接口权限立即生效，刷新主界面更新菜单。</p><div class="toolbar"><button onclick="checkAll(true)">全选</button><button onclick="checkAll(false)">清空</button><button th:if="${canGrant}" id="grantSave" class="primary" onclick="saveGrant()">保存授权</button></div><div class="tree" id="tree"></div></section><section id="userPanel" hidden><form id="userSearch" class="toolbar"><input id="keyword" placeholder="姓名／学工号／手机号"><select id="member"><option value="">全部用户</option><option value="1">已绑定当前角色</option><option value="0">未绑定当前角色</option></select><button class="primary">查询</button></form><div class="toolbar" style="margin-top:14px"><button onclick="batch(true)">为选中用户添加此角色</button><button onclick="batch(false)">从选中用户移除此角色</button></div><p class="muted">批量操作仅修改选中用户与当前角色的关联，保留其他角色。换页会清除当前勾选。</p><div class="table-wrap"><table class="table"><thead><tr><th><input type="checkbox" onchange="$('#users input.user-check:not(:disabled)').prop('checked',this.checked)"></th><th>姓名</th><th>学工号</th><th>现有角色</th><th>当前角色</th><th>操作</th></tr></thead><tbody id="users"></tbody></table></div><div class="pager"><button onclick="userGo(-1)">上一页</button><span id="userCount"></span><button onclick="userGo(1)">下一页</button></div></section><section id="auditPanel" hidden><p class="muted">最近100条授权及角色变更记录</p><div id="audit"></div></section></main></div>
<dialog id="roleDialog"><h3 id="roleDialogTitle">新增角色</h3><form id="roleForm"><input type="hidden" name="id"><div class="fields"><label>角色名称<input name="name" maxlength="30" required></label><label>角色标识<input name="key" pattern="[a-z][a-z0-9_]{1,29}" required placeholder="例如 teacher、finance"></label><label>状态<select name="status"><option value="0">正常</option><option value="1">停用</option></select></label><label class="wide">备注<textarea name="remark" maxlength="500"></textarea></label></div><div class="dialog-actions"><button class="primary">保存</button><button type="button" onclick="document.getElementById('roleDialog').close()">取消</button></div></form></dialog>
<dialog id="bindingDialog"><h3 id="bindingTitle">绑定用户角色</h3><p class="muted">可绑定多个角色；停用角色保留关联，但不提供访问权限。</p><div id="bindingRoles"></div><div class="dialog-actions"><button class="primary" onclick="saveBinding()">保存绑定</button><button onclick="document.getElementById('bindingDialog').close()">取消</button></div></dialog>
<script th:src="@{/js/jquery.min.js}"></script><script th:inline="javascript">
var base=/*[[@{/system/permission}]]*/'',token=/*[[${token}]]*/'',canGrant=/*[[${canGrant}]]*/false,canAssign=/*[[${canAssign}]]*/false,selected=null,roleMap={},nodes=[],bindingUser=null,userPage=1,userTotal=0;
function fail(x){alert(x.responseJSON&&(x.responseJSON.error||x.responseJSON.msg)?(x.responseJSON.error||x.responseJSON.msg):'操作失败或没有权限，请刷新重试');}
function post(path,data,done){data.token=token;$.ajax({url:base+'/'+path,type:'POST',data:data,traditional:true}).done(done).fail(fail);}
function loadRoles(choose){$.getJSON(base+'/roles').done(function(rows){roleMap={};$('#roles').empty();rows.forEach(function(r){roleMap[r.role_id]=r;var b=$('<button>').addClass('role-item').toggleClass('selected',r.role_id===selected);$('<span>').text(r.role_name+(r.status==='1'?'（停用）':'')).appendTo(b);$('<small>').text(r.role_key+' · '+r.user_count+' 人').appendTo(b);b.on('click',function(){selectRole(r.role_id);}).appendTo('#roles');});if(choose)selected=choose;if(!selected&&rows.length)selected=rows[0].role_id;if(selected)selectRole(selected);var requested=new URLSearchParams(location.search).get("user");if(requested&&canAssign&&!window.initialBindingOpened){window.initialBindingOpened=true;openBinding(Number(requested),"用户 "+requested);}}).fail(fail);}
function selectRole(id){selected=id;var r=roleMap[id];$('#roleTitle').text(r.role_name);$('#roleInfo').text('角色标识：'+r.role_key+'　状态：'+(r.status==='0'?'正常':'停用'));$('.role-item').removeClass('selected');$('#roles .role-item').each(function(){if($(this).find('small').text().indexOf(r.role_key+' ·')===0)$(this).addClass('selected');});$('#editRoleButton').prop('disabled',id===1812120000000001);$('#grantSave').prop('disabled',id===1812120000000001);$.getJSON(base+'/grants',{role:id}).done(function(d){nodes=d.menus;var checked={};d.selected.forEach(function(n){checked[n]=true;});$('#tree').empty();var children={};nodes.forEach(function(n){(children[n.parent_id]||(children[n.parent_id]=[])).push(n);});var seen={};function branch(parent,depth){(children[parent]||[]).forEach(function(n){if(seen[n.menu_id])return;seen[n.menu_id]=true;var label=$('<label>').css('padding-left',(8+depth*20)+'px').addClass(n.menu_type==='F'?'node-action':'node-menu');$('<input>').attr('type','checkbox').val(n.menu_id).prop('checked',!!checked[n.menu_id]).prop('disabled',!canGrant||id===1812120000000001).on('change',function(){var state=this.checked;function descend(p){(children[p]||[]).forEach(function(c){$('#tree input[value="'+c.menu_id+'"]').prop('checked',state);descend(c.menu_id);});}descend(n.menu_id);}).appendTo(label);$('<span>').text(n.menu_name).appendTo(label);$('<small>').addClass('tag').text(n.menu_type==='F'?'操作':n.menu_type==='M'?'目录':'菜单').appendTo(label);label.appendTo('#tree');branch(n.menu_id,depth+1);});}branch(0,0);});userPage=1;if(canAssign)loadUsers();}
function checkAll(value){$('#tree input:not(:disabled)').prop('checked',value);}function saveGrant(){if(!selected)return;if(!confirm('确认保存此角色的菜单及操作权限？'))return;var ids=$('#tree input:checked').map(function(){return this.value;}).get();post('grant',{role:selected,ids:ids},function(){alert('授权已保存，刷新主界面更新菜单');selectRole(selected);});}
function tab(name){['grant','user','audit'].forEach(function(k){document.getElementById(k+'Panel').hidden=k!==name;$('#'+k+'Tab').toggleClass('selected',k===name);});if(name==='audit')loadAudit();if(name==='user'&&canAssign)loadUsers();}
function editRole(id){$('#roleForm')[0].reset();$('#roleForm [name=id]').val(id||'');$('#roleDialogTitle').text(id?'维护角色':'新增角色');if(id){var r=roleMap[id];$('#roleForm [name=name]').val(r.role_name);$('#roleForm [name=key]').val(r.role_key);$('#roleForm [name=status]').val(r.status);$('#roleForm [name=remark]').val(r.remark||'');}document.getElementById('roleDialog').showModal();}
$('#roleForm').on('submit',function(e){e.preventDefault();var data={};$(this).serializeArray().forEach(function(x){data[x.name]=x.value;});post('role',data,function(r){document.getElementById('roleDialog').close();loadRoles(r.id);});});
function loadUsers(){if(!selected)return;$.getJSON(base+'/users',{role:selected,keyword:$('#keyword').val(),member:$('#member').val(),page:userPage}).done(function(d){userTotal=d.total;$('#users').empty();d.rows.forEach(function(u){var tr=$('<tr>');$('<td>').append($('<input>').attr('type','checkbox').addClass('user-check').val(u.user_id).prop('disabled',u.user_id===1812120000000000)).appendTo(tr);[u.user_name,u.login_name,u.roles||'未绑定',u.assigned?'已绑定':'未绑定'].forEach(function(v){$('<td>').text(v).appendTo(tr);});var cell=$('<td>');if(u.user_id!==1812120000000000)$('<button>').text('绑定角色').on('click',function(){openBinding(u.user_id,u.user_name+'（'+u.login_name+'）');}).appendTo(cell);cell.appendTo(tr);tr.appendTo('#users');});$('#userCount').text('第'+userPage+'页，共'+userTotal+'人');}).fail(fail);}
$('#userSearch').on('submit',function(e){e.preventDefault();userPage=1;loadUsers();});function userGo(n){if(userPage+n<1||(n>0&&userPage*20>=userTotal))return;userPage+=n;loadUsers();}function batch(add){var users=$('#users input.user-check:checked').map(function(){return this.value;}).get();if(!users.length){alert('请先选择用户');return;}if(!confirm('确认为选中'+users.length+'人'+(add?'添加':'移除')+'“'+roleMap[selected].role_name+'”角色？'))return;post('batch',{role:selected,users:users,add:add},function(){loadRoles(selected);});}
function openBinding(user,name){bindingUser=user;$('#bindingTitle').text('绑定角色 · '+name);$.getJSON(base+'/userRoles',{user:user}).done(function(ids){$('#bindingRoles').empty();Object.keys(roleMap).forEach(function(id){var r=roleMap[id],label=$('<label>');$('<input>').attr('type','checkbox').val(id).prop('checked',ids.indexOf(r.role_id)>=0).appendTo(label);label.append(document.createTextNode(' '+r.role_name+(r.status==='1'?'（停用）':''))).appendTo('#bindingRoles');});document.getElementById('bindingDialog').showModal();}).fail(fail);}
function saveBinding(){var roles=$('#bindingRoles input:checked').map(function(){return this.value;}).get();post('bind',{user:bindingUser,roles:roles},function(){document.getElementById('bindingDialog').close();loadRoles(selected);});}function loadAudit(){$.getJSON(base+'/audit').done(function(rows){$('#audit').empty();var names={ROLE:'角色维护',GRANT:'权限授权',BIND:'用户绑定'};rows.forEach(function(a){var x=$('<details>');$('<summary>').text(a.created_at+' · '+(names[a.action]||a.action)+' · 操作人 '+a.actor_id+' · 对象 '+a.target_id).appendTo(x);$('<pre>').text(a.detail).appendTo(x);x.appendTo('#audit');});}).fail(fail);}loadRoles();
</script></body></html>
