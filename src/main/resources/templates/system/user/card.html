<!DOCTYPE html><html lang="zh" xmlns:th="http://www.thymeleaf.org"><head th:include="include :: header"></head><body class="white-bg"><div class="wrapper wrapper-content"><h3>一卡通卡片管理</h3><p>用户：<strong th:text="${user.userName}"></strong>　学工号：<span th:text="${user.loginName}"></span></p><div class="alert alert-info">当前写卡通过数据库模拟记录实现，未连接实体读卡器。写入内容格式：CAMPUS-CARD-V1 | 卡号 | 用户ID。其中 CAMPUS-CARD-V1 表示校园卡数据格式第1版，卡号标识该卡，用户ID关联持卡用户，竖线为字段分隔符。内容不包含密码或余额。</div><div th:if="${#maps.isEmpty(card)}"><p>尚未开卡。补充开卡将生成唯一卡号，一个账号最多一张有效卡；注销后可重新开卡。</p><button class="btn btn-success" onclick="operate('issue')">补充开卡</button></div><div th:unless="${#maps.isEmpty(card)}"><p>一卡通卡号：<strong th:text="${card.card_no}"></strong></p><p>写卡次数：<span th:text="${card.write_count}"></span>　最近写卡：<span th:text="${card.last_written_at ?: '尚未写卡'}"></span></p><button class="btn btn-primary" onclick="operate('write')" th:disabled="${user.status != '0'}">写卡</button><button class="btn btn-danger" onclick="operate('cancel')">注销卡片</button><p th:if="${user.status != '0'}" class="text-warning">用户已停用，不能写卡。</p></div><p id="result" role="status"></p><h4>已注销卡片</h4><p th:each="c:${cancelled}"><span th:text="${c.card_no}"></span>　<span th:text="${c.cancelled_at}"></span></p><h4>最近20次写卡记录</h4><table class="table table-bordered"><thead><tr><th>编号</th><th>操作人ID</th><th>时间</th><th>写入内容</th></tr></thead><tbody><tr th:each="item:${history}"><td th:text="${item.id}"></td><td th:text="${item.operator_id}"></td><td th:text="${item.written_at}"></td><td th:text="${item.payload}"></td></tr></tbody></table></div><div th:include="include :: footer"></div><script th:inline="javascript">
var endpoint=/*[[@{/system/user/card/{id}(id=${user.userId})}]]*/ '';
var token=/*[[${token}]]*/ '';var key=/*[[${requestKey}]]*/ '';
function operate(action){var question=action==='cancel'?'确认注销当前卡片？钱包余额和流水保留。':action==='write'?'确认写入当前用户卡号？':'确认为该用户补充开卡？';layer.confirm(question,function(index){layer.close(index);$('button').prop('disabled',true);$.post(endpoint,{action:action,token:token,requestKey:key}).done(function(r){$('#result').text(r.msg);if(r.code===0){if(parent.$&&parent.$.table)parent.$.table.refresh();setTimeout(function(){location.reload();},700);}}).fail(function(){$('#result').text('操作结果未确认，请重试；同一页面重试不会重复写入。');}).always(function(){$('button').prop('disabled',false);});});}
</script></body></html>
