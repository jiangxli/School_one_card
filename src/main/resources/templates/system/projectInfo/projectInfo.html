<!DOCTYPE HTML>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
    <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="user-form">
                    <div class="select-list">
                        <ul>
                            <li>
                                考勤码：<input type="text" name="projectId"/>
                            </li>
                            <li>
                                考勤项目：<input type="text" name="projectName"/>
                            </li>
                            <li class="select-time">
                                <label>创建时间： </label>
                                <input type="text" class="time-input" name="params[beginTime]"/>
                                <span>-</span>
                                <input type="text" class="time-input" name="params[endTime]"/>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>
            <div class="btn-group-sm hidden-xs" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="system:projectInfo:add">
                    <i class="fa fa-plus"></i> 添加
                </a>
            </div>

            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table" data-mobile-responsive="true"></table>
            </div>
        </div>
    </div>
    <div th:include="include :: footer"></div>
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('system:projectInfo:edit')}]];
        var removeFlag = [[${@permission.hasPermi('system:projectInfo:remove')}]];
        var prefix = ctx + "system/projectInfo";

        // var datas = [[${@dict.getType('sys_normal_disable')}]];
        // formatter: function(value, row, index) {
        //     return $.table.selectDictLabel(datas, value);
        // }
        $(function() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                detailUrl: prefix + "/detail/{id}",
                removeUrl: prefix + "/remove",
                showRefresh:true,
                modalName: "考勤项目",
                columns: [{
		            checkbox: true
		        },
				{
					field : 'projectId', 
					title : '考勤码' 
				},
				{
					field : 'projectName', 
					title : '考勤项目' 
				},
				{
					field : 'startTime', 
					title : '考勤开始时间' 
				},
				{
					field : 'endTime', 
					title : '考勤结束时间' 
				},
				{
					field : 'userName',
					title : '创建人' 
				},
                {
                    field : 'userNum',
                    title : '加入人数量'
                },
				{
					field : 'createTime', 
					title : '创建时间' 
				},
		        {
		            title: '操作',
		            align: 'center',
		            formatter: function(value, row, index) {
		            	var actions = [];
                        actions.push('<a class="btn btn-primary btn-xs" href="javascript:void(0)" onclick="$.operate.detail(\'' + row.projectId + '\')"><i class="fa fa-eye"></i>查看</a> ');
                        actions.push('<a class="btn btn-info btn-xs" href="javascript:void(0)" onclick="attendDetail(\'' + row.projectId + '\')"><i class="fa fa-eye"></i>考勤</a> ');
		            	actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.projectId + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.projectId + '\')"><i class="fa fa-remove"></i>删除</a>');
						return actions.join('');
		            }
		        }]
            };
            $.table.init(options);
        });

        function attendDetail(projectId) {
            var url = ctx + 'system/projectAttend?projectId=' + projectId;
            createMenuItem(url, "考勤详情");
        }
    </script>
</body>
</html>
