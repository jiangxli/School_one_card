<!DOCTYPE HTML>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
    <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="user-form">
                    <div class="select-list">
                        <ul>
                            <li>
                                考勤项目：<input type="text" name="projectName"/>
                            </li>
                            <li>
                                状态：<select name="status" >
                                <option value="">所有</option>
                                <option value="0">正常</option>
                                <option value="1">迟到</option>
                            </select>
                            </li>
                            <li class="select-time">
                                <label>时间： </label>
                                <input type="text" class="time-input" name="params[beginTime]"/>
                                <span>-</span>
                                <input type="text" class="time-input" name="params[endTime]"/>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>
            <div class="btn-group-sm hidden-xs" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add()">
                    <i class="fa fa-plus"></i> 添加考勤
                </a>
                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="system:role:export">
                    <i class="fa fa-download"></i> 导出
                </a>
            </div>

            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table" data-mobile-responsive="true"></table>
            </div>
        </div>
    </div>
    <div th:include="include :: footer"></div>
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('system:projectAttend:edit')}]];
        var removeFlag = [[${@permission.hasPermi('system:projectAttend:remove')}]];
        var prefix = ctx + "system/projectAttend";

        // var datas = [[${@dict.getType('sys_normal_disable')}]];
        // formatter: function(value, row, index) {
        //     return $.table.selectDictLabel(datas, value);
        // }
        $(function() {
            var options = {
                url: prefix + "/listMy",
                createUrl: prefix + "/add",
                exportUrl: prefix + "/exportMy",
                showRefresh:true,
                modalName: "考勤记录",
                columns: [
				{
					field : 'id', 
					title : '主键',
                    visible:false
				},
				{
					field : 'userName',
					title : '考勤人' 
				},
				{
					field : 'status', 
					title : '状态',
                    formatter: function(value, row, index) {
					    return value==1?"迟到":"正常";
                    }
				},
				{
					field : 'createTime', 
					title : '考勤时间' 
				},
				{
					field : 'projectName',
					title : '考勤项目' 
				}]
            };
            $.table.init(options);
        });

        function add() {
            $.operate.submit(prefix+"/add","post","json",{});
        }
    </script>
</body>
</html>
