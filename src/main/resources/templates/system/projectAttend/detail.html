<!DOCTYPE HTML>
<html  lang="zh" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-projectAttend-edit" th:object="${projectAttend}">
            <input id="id" name="id" th:field="*{id}"  type="hidden">
            <div class="form-group">	
                <label class="col-sm-3 control-label">考勤人：</label>
                <div class="col-sm-8">
                    <label class="control-label" th:text="*{userId}"></label>
                </div>
            </div>
            <div class="form-group">	
                <label class="col-sm-3 control-label">0正常1迟到：</label>
                <div class="col-sm-8">
                    <label class="control-label" th:text="*{status}"></label>
                </div>
            </div>
            <div class="form-group">	
                <label class="col-sm-3 control-label">考勤时间：</label>
                <div class="col-sm-8">
                    <label class="control-label" th:text="*{createTime}"></label>
                </div>
            </div>
            <div class="form-group">	
                <label class="col-sm-3 control-label">考勤项目：</label>
                <div class="col-sm-8">
                    <label class="control-label" th:text="*{projectId}"></label>
                </div>
            </div>
		</form>
    </div>
</body>
</html>
