<!DOCTYPE HTML>
<html  lang="zh" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
	<form class="form-horizontal m" id="form-notice-add">
		<div class="form-group">
			<label class="col-sm-3 control-label">公告标题：</label>
			<div class="col-sm-8">
				<input id="noticeTitle" name="noticeTitle" class="form-control" type="text">
			</div>
		</div>
		<div class="form-group">
			<label class="col-sm-3 control-label">公告类型：</label>
			<div class="col-sm-8">
				<select name="noticeType" class="form-control m-b" th:with="type=${@dict.getType('sys_notice_type')}">
					<option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
				</select>
			</div>
		</div>
		<div class="form-group">
			<label class="col-sm-3 control-label">公告状态：</label>
			<div class="col-sm-8">
				<div class="radio-box" th:each="dict : ${@dict.getType('sys_notice_status')}">
					<input type="radio" th:id="${dict.dictCode}" name="status" th:value="${dict.dictValue}" th:checked="${dict.isDefault == 'Y' ? true : false}">
					<label th:for="${dict.dictCode}" th:text="${dict.dictLabel}"></label>
				</div>
			</div>
		</div>
		<div class="form-group">
			<label class="col-sm-3 control-label">附件：</label>
			<div class="col-sm-8">
				<input id="fileName" name="fileName" type="hidden">
				<input id="file" name="file" type="file" onchange="selectFile(this.value)">
			</div>
		</div>
		<div class="form-group">
			<label class="col-sm-3 control-label">公告内容：</label>
			<div class="col-sm-8">
				<input id="noticeContent" name="noticeContent" type="hidden">
				<div class="summernote" sn-data-id="noticeContent"></div>
			</div>
		</div>
	</form>
</div>
<div th:include="include::footer"></div>

<script type="text/javascript">
    var prefix = ctx + "system/notice";

    $("#form-notice-add").validate({
        rules:{
            noticeTitle:{
                required:true,
            }
        }
    });
    $.form.init({
		url:prefix + "/add",
        beforeSubmit:function () {
			return $.validate.form();
        },
		success:function (result) {
            $.operate.successCallback(result);
        }
	});
    function submitHandler() {
        $('#form-notice-add').submit();
    }
    function selectFile(filePath) {
		$("#fileName").val(filePath.substring(filePath.lastIndexOf("\\")+1));
    }
</script>
</body>
</html>
