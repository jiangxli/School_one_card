<!DOCTYPE HTML>
<html  lang="zh" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-bookBorrowRecord-edit" th:object="${bookBorrowRecord}">
            <input id="id" name="id" th:field="*{id}"  type="hidden">
            <div class="form-group">	
                <label class="col-sm-3 control-label">书籍：</label>
                <div class="col-sm-8">
                    <label class="control-label" th:text="*{bookName}"></label>
                </div>
            </div>
            <div class="form-group">	
                <label class="col-sm-3 control-label">用户：</label>
                <div class="col-sm-8">
                    <label class="control-label" th:text="*{userName}"></label>
                </div>
            </div>
            <div class="form-group">	
                <label class="col-sm-3 control-label">借书时间：</label>
                <div class="col-sm-8">
                    <label class="control-label" th:text="*{borrowTime}"></label>
                </div>
            </div>
            <div class="form-group" th:if="${bookBorrowRecord.returnTime!=nul}">
                <label class="col-sm-3 control-label">还书时间：</label>
                <div class="col-sm-8">
                    <label class="control-label" th:text="*{returnTime}"></label>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">借书时长：</label>
                <div class="col-sm-8">
                    <label class="control-label" id="duration"></label>
                </div>
            </div>

            <div class="form-group">	
                <label class="col-sm-3 control-label">状态：</label>
                <div class="col-sm-8">
                    <label class="control-label" id="status" th:text="*{status}"></label>
                </div>
            </div>
		</form>
    </div>
    <div th:include="include :: footer"></div>
    <script th:inline="javascript">
        var datas = [[${@dict.getType('borrow_book_status')}]];
        $("#status").html($.table.selectDictLabel(datas, $("#status").html()));
        var d1 = [[${bookBorrowRecord.borrowTime}]];
        var d2 = [[${bookBorrowRecord.returnTime}]];
        var status = [[${bookBorrowRecord.status}]];
        $("#duration").html(showTimeStr(d1,d2,status));
    </script>
</body>
</html>
