<!DOCTYPE HTML>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
    <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="user-form">
                    <div class="select-list">
                        <ul>
                            <li>
                                图书名称：<input type="text" name="bookName"/>
                            </li>
                            <li>
                                作者：<input type="text" name="author"/>
                            </li>
                            <li class="select-time">
                                <label>借书时间： </label>
                                <input type="text" class="time-input" name="params[beginTime]"/>
                                <span>-</span>
                                <input type="text" class="time-input" name="params[endTime]"/>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table" data-mobile-responsive="true"></table>
            </div>
        </div>
    </div>
    <div th:include="include :: footer"></div>
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('system:bookBorrowRecord:edit')}]];
        var removeFlag = [[${@permission.hasPermi('system:bookBorrowRecord:remove')}]];
        var prefix = ctx + "system/bookBorrowRecord";

        var datas = [[${@dict.getType('borrow_book_status')}]];

        $(function() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                detailUrl: prefix + "/detail/{id}",
                removeUrl: prefix + "/remove",
                search: false,
                showSearch:false,
                showRefresh:false,
                showColumns:false,
                showToggle:false,
                showExport:false,
                modalName: "借阅记录",
                columns: [{
		            checkbox: true
		        },
                {
                    field : 'id',
                    title : '编号',
                    visible:false
                },
				{
					field : 'bookName',
					title : '书籍' 
				},
				{
					field : 'userName',
					title : '用户' 
				},
				{
					field : 'borrowTime', 
					title : '借书时间' 
				},
                {
                    field : 'returnTime',
                    title : '还书时间'
                },
				{
					field : 'returnTime', 
					title : '借书时长',
                    formatter: function(value, row, index) {
                        return showTimeStr(row.borrowTime,value,row.status);
                    }
				},
				{
					field : 'status', 
					title : '状态',
                    formatter: function(value, row, index) {
                        return $.table.selectDictLabel(datas, value);
                    }
				},
		        {
		            title: '操作',
		            align: 'center',
		            formatter: function(value, row, index) {
		            	var actions = [];
                        actions.push('<a class="btn btn-primary btn-xs" href="javascript:void(0)" onclick="$.operate.detail(\'' + row.id + '\')"><i class="fa fa-eye"></i>查看</a> ');
                        if(row.status == 0){
                            actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="returnBack(\'' + row.id + '\','+row.bookId+',\''+row.bookName+'\')"><i class="fa fa-edit"></i>还书</a> ');
                        }
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>删除</a>');
						return actions.join('');
		            }
		        }]
            };
            $.table.init(options);
        });

        function returnBack(id,bookId,bookName) {
            $.modal.confirm("确定还书【"+bookName+"】吗？",function () {
               $.operate.submit(prefix+"/edit","post","json",{id:id,bookId:bookId});
            });
        }
    </script>
</body>
</html>
