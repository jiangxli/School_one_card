<!DOCTYPE HTML>
<html  lang="zh" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-bookInfo-edit" th:object="${bookInfo}">
            <input id="bookId" name="bookId" th:field="*{bookId}"  type="hidden">
            <div class="form-group">	
                <label class="col-sm-3 control-label">图书名称：</label>
                <div class="col-sm-8">
                    <input id="bookName" name="bookName" th:field="*{bookName}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">	
                <label class="col-sm-3 control-label">作者：</label>
                <div class="col-sm-8">
                    <input id="author" name="author" th:field="*{author}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">图书类型：</label>
                <div class="col-sm-8">
                    <select id="kind" name="kind" class="form-control m-b" th:with="type=${@dict.getType('book_kind')}">
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{kind}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">图书数量：</label>
                <div class="col-sm-8">
                    <input id="bookNum" name="bookNum" th:field="*{bookNum}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">	
                <label class="col-sm-3 control-label">出版社：</label>
                <div class="col-sm-8">
                    <input id="publisher" name="publisher" th:field="*{publisher}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">	
                <label class="col-sm-3 control-label">出版时间：</label>
                <div class="col-sm-8">
                    <input id="publishDate" name="publishDate" th:field="*{publishDate}" class="form-control time-input" readonly type="text">
                </div>
            </div>

		</form>
    </div>
    <div th:include="include::footer"></div>
    <script th:inline="javascript">
		var prefix = ctx + "system/bookInfo"
		$("#form-bookInfo-edit").validate({
			rules:{
				xxxx:{
					required:true,
				},
			}
		});
		
		function submitHandler() {
	        if ($.validate.form()) {
	            $.operate.save(prefix + "/edit", $('#form-bookInfo-edit').serialize());
	        }
	    }
	</script>
</body>
</html>
