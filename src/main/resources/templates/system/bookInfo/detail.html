<!DOCTYPE HTML>
<html  lang="zh" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-bookInfo-edit" th:object="${bookInfo}">
            <input id="bookId" name="bookId" th:field="*{bookId}"  type="hidden">
            <div class="form-group">	
                <label class="col-sm-3 control-label">图书名称：</label>
                <div class="col-sm-8">
                    <label class="control-label" th:text="*{bookName}"></label>
                </div>
            </div>
            <div class="form-group">	
                <label class="col-sm-3 control-label">作者：</label>
                <div class="col-sm-8">
                    <label class="control-label" th:text="*{author}"></label>
                </div>
            </div>
            <div class="form-group">	
                <label class="col-sm-3 control-label">出版社：</label>
                <div class="col-sm-8">
                    <label class="control-label" th:text="*{publisher}"></label>
                </div>
            </div>
            <div class="form-group">	
                <label class="col-sm-3 control-label">出版时间：</label>
                <div class="col-sm-8">
                    <label class="control-label" th:text="*{publishDate}"></label>
                </div>
            </div>
            <div class="form-group">	
                <label class="col-sm-3 control-label">图书类型：</label>
                <div class="col-sm-8">
                    <label class="control-label" th:text="*{kind}"></label>
                </div>
            </div>
            <div class="form-group">	
                <label class="col-sm-3 control-label">图书数量：</label>
                <div class="col-sm-8">
                    <label class="control-label" th:text="*{bookNum}"></label>
                </div>
            </div>
            <div class="form-group">	
                <label class="col-sm-3 control-label">创建时间：</label>
                <div class="col-sm-8">
                    <label class="control-label" th:text="*{createTime}"></label>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">借阅次数：</label>
                <div class="col-sm-8">
                    <label class="control-label" th:text="*{borrowNum+'次'}"></label>
                </div>
            </div>
		</form>
    </div>
</body>
</html>
