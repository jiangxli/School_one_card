<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>商户管理</title><link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"><style>body{font-family:"Microsoft YaHei",Arial,sans-serif;color:#303744;background:#f5f6f8;padding:20px;font-size:14px}h2{font-size:20px;font-weight:600;margin:0 0 20px}h3{font-size:18px}form.search{display:flex;flex-wrap:wrap;gap:16px;align-items:end;background:#fff;border:1px solid #e7e9ed;border-radius:6px;padding:20px;margin-bottom:18px}label{display:flex;flex-direction:column;gap:7px;color:#697586;font-size:13px;font-weight:400}input,select,textarea{border:1px solid #d6dce4;border-radius:4px;padding:8px 10px;min-height:36px;color:#303744;background:#fff}button,.btn{border-radius:4px;padding:8px 15px;font-size:13px}button{border:1px solid #d6dce4;background:white}.primary{background:#337ab7;color:white;border-color:#337ab7}.table{background:white;font-size:13px;border:1px solid #e7e9ed}.table th{background:#f0f3f7;color:#5b6572;white-space:nowrap}.table td,.table th{padding:13px 16px!important;vertical-align:middle!important}.table tbody tr:hover{background:#f7faff}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{padding:4px 10px;color:#337ab7}.pager{text-align:right;margin:16px 0}.pager span{margin:0 12px;color:#697586}.good{color:#237a49}.muted{color:#87909b}.bad{color:#a76612}dialog{border:0;border-radius:8px;padding:24px;box-shadow:0 10px 40px #0003;width:min(900px,92vw);max-height:88vh;overflow:auto}dialog::backdrop{background:#0006}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.wide{grid-column:1/-1}.dialog-actions{margin-top:20px;display:flex;gap:10px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:18px 0}.summary div{padding:12px 0}.summary small{display:block;color:#87909b}.summary strong{font-size:20px}#audit details{padding:10px;border-bottom:1px solid #e7e9ed}pre{white-space:pre-wrap;overflow-wrap:anywhere}.table-wrap{overflow:auto}@media(max-width:600px){.fields,.summary{grid-template-columns:1fr}.wide{grid-column:auto}}#detail{width:min(1180px,94vw);max-height:90vh;padding:0;overflow:hidden;color:#303744}#detail[open]{display:flex;flex-direction:column}.detail-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid #e7e9ed;background:#fff;flex-shrink:0}.eyebrow{font-size:12px;color:#87909b}.detail-header h3{margin:5px 0 0;font-size:18px;font-weight:600}.close-detail{border:0;font-size:25px;color:#87909b;padding:0 8px;background:transparent}.detail-body{padding:20px 24px;overflow-y:auto;min-height:0;background:#f8f9fb}.section-heading{font-size:14px;font-weight:600;margin:0 0 16px}#basic{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 24px;background:white;border:1px solid #e7e9ed;border-radius:6px;padding:18px 20px}.basic-label{display:block;color:#87909b;font-size:12px;margin-bottom:5px}.basic-value{display:block;font-size:13px;overflow-wrap:anywhere}.summary{grid-template-columns:repeat(3,minmax(0,1fr));gap:0;background:white;border:1px solid #e7e9ed;border-radius:6px;margin:16px 0 20px;padding:16px 0}.summary div{padding:0 20px;border-right:1px solid #e7e9ed}.summary div:last-child{border:0}.summary small{font-size:12px;margin-bottom:5px}.summary strong{font-size:22px;color:#2879b0;font-variant-numeric:tabular-nums}.detail-tabs{display:flex;border-bottom:1px solid #dce2ea;gap:22px;margin-bottom:14px}.detail-tabs button{background:none;border:0;border-radius:0;padding:10px 0;color:#697586}.detail-tabs button.selected{color:#337ab7;border-bottom:2px solid #337ab7;font-weight:600}.detail-note{font-size:12px;color:#87909b;margin-bottom:12px}#detail .table{font-size:12px;margin-bottom:0}#detail .table td,#detail .table th{padding:11px 12px!important;white-space:nowrap}#detail .table td:first-child,#detail .table td:last-child{font-family:Consolas,monospace;font-size:11px}#detail .table td:nth-child(4),#detail .table th:nth-child(4){text-align:right;font-variant-numeric:tabular-nums}#detail .table-wrap{border-radius:4px;background:#fff}#detail .pager{margin:14px 0 0;font-size:12px}#audit{background:#fff;border:1px solid #e7e9ed;border-radius:6px}#audit details{padding:12px 16px}#audit summary{cursor:pointer;font-size:13px}#audit pre{font-size:12px;margin-top:12px;background:#f7f9fc;border:0}.detail-footer{padding:12px 24px;border-top:1px solid #e7e9ed;background:#fff;text-align:right;flex-shrink:0}@media(max-width:900px){#basic{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){#basic{grid-template-columns:1fr}.detail-header,.detail-body,.detail-footer{padding:16px}.summary strong{font-size:17px}.summary div{padding:0 10px}} form.search{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:start;gap:16px 20px}form.search label{min-width:0;margin:0}form.search input,form.search select{height:36px;min-height:36px;line-height:20px;padding:7px 10px;width:100%;box-sizing:border-box}.search-actions{grid-column:1/-1;display:flex;gap:10px;align-items:center;border-top:1px solid #eef0f3;padding-top:16px}.search-actions button{height:36px;min-height:36px;padding:7px 18px;line-height:20px;margin:0}.form-section{font-size:14px;font-weight:600;border-bottom:1px solid #e7e9ed;padding:10px 0;margin:0 0 4px;color:#303744}#editor{padding:24px;max-width:940px}.photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.photo-field{border:1px solid #e7e9ed;border-radius:5px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:12px}.photo-field input[type=file]{max-width:100%;font-size:11px;padding:4px}.photo-field small{color:#87909b}.photo-field img{width:100%;height:120px;object-fit:contain;background:#f5f6f8}.photo-field img[hidden]{display:none}.detail-photos{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px}.detail-photos figure{margin:0;background:white;border:1px solid #e7e9ed;padding:10px;border-radius:5px}.detail-photos img{width:180px;height:120px;object-fit:contain}.detail-photos figcaption{font-size:12px;text-align:center;color:#697586;margin-top:6px}@media(max-width:1000px){form.search{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){form.search,.photo-grid{grid-template-columns:1fr}} </style></head><body><h2>商户管理</h2><form id="search" class="search"><label>商户名称<input name="name" placeholder="支持模糊查询"></label><label>商户编号<input name="number" placeholder="请输入商户编号"></label><label>商户类型<select name="category"><option value="">全部类型</option><option value="CATERING">餐饮</option><option value="RETAIL">零售</option><option value="SERVICE">服务</option><option value="OTHER">其他</option><option value="SYSTEM">系统测试</option></select></label><label>状态<select name="active"><option value="">全部状态</option><option value="1">启用</option><option value="0">停用</option></select></label><label>负责人<input name="owner" placeholder="支持负责人姓名模糊查询"></label><label>创建起始日期<input type="date" name="start"></label><label>创建截止日期<input type="date" name="end"></label><div class="search-actions"><button class="primary">查询</button><button type="reset">重置</button><button type="button" class="primary" th:if="${cansave}" onclick="edit()">新增商户</button></div></form><div class="table-wrap"><table class="table"><thead><tr><th>商户编号</th><th>商户名称</th><th>类型</th><th>负责人</th><th>负责人电话</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><button id="prev" onclick="go(-1)">上一页</button><span id="count"></span><button id="next" onclick="go(1)">下一页</button></div>
<dialog id="editor"><h3 id="editTitle">新增商户</h3><form id="save"><input type="hidden" name="id"><div class="fields"><h4 class="form-section wide">基本资料</h4><label>商户名称<input name="name" required maxlength="100"></label><label>商户类型<select name="category"><option value="CATERING">餐饮</option><option value="RETAIL">零售</option><option value="SERVICE">服务</option><option value="OTHER">其他</option></select></label><div class="wide"><button type="button" th:if="${cancategory}" onclick="addCategory()">＋ 添加商户类型</button></div><label>负责人姓名<input name="owner_name" required maxlength="50"></label><label>负责人电话<input name="owner_phone" required maxlength="30"></label><label>业务联系人<input name="contact" required maxlength="50"></label><label>业务联系电话<input name="phone" required maxlength="30"></label><label class="wide">经营地址<input name="address" required maxlength="200"></label><label class="wide">商户简介<textarea name="introduction" maxlength="2000" rows="3" placeholder="经营范围、服务内容及商户介绍"></textarea></label><label class="wide">备注<textarea name="remark" maxlength="500"></textarea></label><h4 class="form-section wide">证照与许可</h4><label>营业执照编号<input name="license_no" maxlength="100"></label><label>许可编号<input name="permit_no" maxlength="100"></label><label>许可有效期至<input name="permit_expiry" type="date"></label><div></div><div class="photo-grid wide"><div class="photo-field"><span>营业执照照片</span><input type="hidden" name="license_image"><img id="preview-license_image" alt="营业执照照片" hidden><input type="file" accept="image/png,image/jpeg" onchange="uploadPhoto(this,'license_image')"><small>PNG／JPEG，单张不超过3MB</small><button type="button" onclick="clearPhoto('license_image')">移除图片</button></div><div class="photo-field"><span>许可证明照片</span><input type="hidden" name="permit_image"><img id="preview-permit_image" alt="许可证明照片" hidden><input type="file" accept="image/png,image/jpeg" onchange="uploadPhoto(this,'permit_image')"><small>PNG／JPEG，单张不超过3MB</small><button type="button" onclick="clearPhoto('permit_image')">移除图片</button></div><div class="photo-field"><span>商户照片</span><input type="hidden" name="merchant_image"><img id="preview-merchant_image" alt="商户照片" hidden><input type="file" accept="image/png,image/jpeg" onchange="uploadPhoto(this,'merchant_image')"><small>PNG／JPEG，单张不超过3MB</small><button type="button" onclick="clearPhoto('merchant_image')">移除图片</button></div></div></div><div class="dialog-actions"><button class="primary" id="saveButton">保存</button><button type="button" onclick="document.getElementById('editor').close()">取消</button></div></form></dialog>
<dialog id="detail"><header class="detail-header"><div><span class="eyebrow">商户详情</span><h3 id="detailTitle"></h3></div><button type="button" class="close-detail" aria-label="关闭商户详情" onclick="document.getElementById('detail').close()">×</button></header><div class="detail-body"><h4 class="section-heading">基本信息</h4><div id="basic" class="fields"></div><div class="summary" id="summary"></div><nav class="detail-tabs"><button id="tradeTab" class="selected" onclick="switchDetailTab('trade')">交易记录</button><button id="auditTab" onclick="switchDetailTab('audit')">操作记录</button></nav><section id="tradePanel"><p class="detail-note">金额为历史累计消费及退款，未扣除结算；交易保留发生时的商户名称。</p><div class="table-wrap"><table class="table"><thead><tr><th>资金流水号</th><th>类型</th><th>发生时商户名称</th><th>金额（元）</th><th>时间</th><th>原消费流水号</th></tr></thead><tbody id="trades"></tbody></table></div><div class="pager"><button onclick="detailPage(-1)">上一页</button><span id="detailCount"></span><button onclick="detailPage(1)">下一页</button></div></section><section id="auditPanel" hidden><p class="detail-note">最近50条操作记录</p><div id="audit"></div></section></div><footer class="detail-footer"><button onclick="document.getElementById('detail').close()">关闭</button></footer></dialog>
<script th:src="@{/js/jquery.min.js}"></script><script th:inline="javascript">
var canSave=/*[[${cansave}]]*/false,canStatus=/*[[${canstatus}]]*/false;
var canApi=/*[[${canapi}]]*/false;
var apiAdmin=/*[[@{/system/merchantApi}]]*/'';
var uploading=0;
var base=/*[[@{/campus/merchant}]]*/'',token=/*[[${token}]]*/'',page=1,total=0,cache={},selected=null,dp=1,dt=0;
var categories={CATERING:'餐饮',RETAIL:'零售',SERVICE:'服务',OTHER:'其他',SYSTEM:'系统测试'},actions={CREATE:'创建',UPDATE:'修改',ENABLE:'启用',DISABLE:'停用'};
function fail(x){alert(x.responseJSON&&x.responseJSON.error?x.responseJSON.error:'操作失败，请检查权限或稍后重试');}
function load(){var q=$('#search').serializeArray();q.push({name:'page',value:page});$.getJSON(base+'/search',q).done(function(d){total=d.total;cache={};$('#rows').empty();d.rows.forEach(function(m){cache[m.id]=m;var tr=$('<tr>');[m.merchant_no,m.name,categories[m.category]||'其他',m.owner_name||'待完善',m.owner_phone||'—'].forEach(function(v){$('<td>').text(v).appendTo(tr);});$('<td>').text(m.active===1?'启用':'停用').addClass(m.active===1?'good':'bad').appendTo(tr);var cell=$('<td>'),buttons=$('<div>').addClass('actions');$('<button>').text('详情').on('click',function(){showDetail(m.id);}).appendTo(buttons);if(m.id!==3){if(canApi){$('<button>').text('接口配置').on('click',function(){location.href=apiAdmin+'?merchant='+m.id;}).appendTo(buttons);}if(canSave){$('<button>').text('编辑').on('click',function(){edit(m.id);}).appendTo(buttons);}if(canStatus){$('<button>').text(m.active===1?'停用':'启用').on('click',function(){status(m);}).appendTo(buttons);}}else{$('<span>').addClass('muted').text('系统保护').appendTo(buttons);}cell.append(buttons).appendTo(tr);tr.appendTo('#rows');});if(!d.rows.length)$('<tr>').append($('<td>').attr('colspan',7).text('暂无符合条件的商户')).appendTo('#rows');$('#count').text('第'+page+'页，共'+total+'个商户');$('#prev').prop('disabled',page<=1);$('#next').prop('disabled',page*20>=total);}).fail(fail);}
function go(n){if(page+n<1||(n>0&&page*20>=total))return;page+=n;load();}$('#search').on('submit',function(e){e.preventDefault();page=1;load();}).on('reset',function(){setTimeout(function(){page=1;load();},0);});
function edit(id){$('#save')[0].reset();['license_image','permit_image','merchant_image'].forEach(clearPhoto);$('#save [name=id]').val(id||'');$('#editTitle').text(id?'编辑商户（'+cache[id].merchant_no+'）':'新增商户');if(id){var m=cache[id];['name','category','phone','address','remark','owner_name','owner_phone','license_no','permit_no','permit_expiry','introduction'].forEach(function(k){$('#save [name='+k+']').val(m[k]);});$('#save [name=contact]').val(m.contact_name);['license_image','permit_image','merchant_image'].forEach(function(k){if(m[k]){$('#save [name='+k+']').val(m[k]);$('#preview-'+k).attr('src',base+'/image/'+m[k]).prop('hidden',false);}});}document.getElementById('editor').showModal();}
$('#save').on('submit',function(e){e.preventDefault();if(uploading){alert('图片正在上传，请完成后保存');return;}var data=$(this).serializeArray();data.push({name:'token',value:token});$('#saveButton').prop('disabled',true);$.post(base+'/save',data).done(function(){document.getElementById('editor').close();load();}).fail(fail).always(function(){$('#saveButton').prop('disabled',false);});});
function status(m){var reason=prompt('请填写'+(m.active===1?'停用':'启用')+'商户“'+m.name+'”的原因：');if(!reason)return;$.post(base+'/status',{id:m.id,active:m.active===1?0:1,reason:reason,token:token}).done(load).fail(fail);}
function switchDetailTab(tab){document.getElementById('tradePanel').hidden=tab!=='trade';document.getElementById('auditPanel').hidden=tab!=='audit';$('#tradeTab').toggleClass('selected',tab==='trade');$('#auditTab').toggleClass('selected',tab==='audit');}function showDetail(id){selected=id;dp=1;switchDetailTab('trade');fetchDetail();}function detailPage(n){if(dp+n<1||(n>0&&dp*20>=dt))return;dp+=n;fetchDetail();}
function fetchDetail(){$.getJSON(base+'/detail',{id:selected,page:dp}).done(function(d){var m=d.merchant;dt=d.total;$('#detailTitle').text(m.name+' · '+m.merchant_no);$('#basic').empty();var fields={类型:categories[m.category]||'其他',对接商户ID:m.api_id||'未开通',负责人:m.owner_name||'待完善',负责人电话:m.owner_phone||'—',营业执照编号:m.license_no||'未登记',许可编号:m.permit_no||'未登记',许可有效期:m.permit_expiry||'未登记',商户简介:m.introduction||'—',状态:m.active===1?'启用':'停用',联系人:m.contact_name||'待完善',联系电话:m.phone||'—',经营地址:m.address||'—',备注:m.remark||'—',创建时间:m.created_at,更新时间:m.updated_at};Object.keys(fields).forEach(function(k){var field=$('<div>').addClass('basic-field');$('<span>').addClass('basic-label').text(k).appendTo(field);$('<span>').addClass('basic-value').text(fields[k]||'—').appendTo(field);field.appendTo('#basic');});$('#merchantPhotos').remove();var gallery=$('<div>').attr('id','merchantPhotos').addClass('detail-photos');var photoNames={license_image:'营业执照',permit_image:'许可证明',merchant_image:'商户照片'};Object.keys(photoNames).forEach(function(k){if(m[k]){var figure=$('<figure>');$('<img>').attr('src',base+'/image/'+m[k]).attr('alt',photoNames[k]).appendTo(figure);$('<figcaption>').text(photoNames[k]).appendTo(figure);figure.appendTo(gallery);}});gallery.insertAfter('#basic');$('#summary').empty();var sums={累计消费:Number(d.summary.consumption),累计退款:Number(d.summary.refunds),净消费:Number(d.summary.consumption)-Number(d.summary.refunds)};Object.keys(sums).forEach(function(k){var x=$('<div>');$('<small>').text(k).appendTo(x);$('<strong>').text(sums[k].toFixed(2)+' 元').appendTo(x);x.appendTo('#summary');});$('#trades').empty();d.rows.forEach(function(r){var tr=$('<tr>');[r.transaction_no,r.kind==='PAY'?'消费':'退款',r.merchant_name_snapshot||'—',Number(r.amount).toFixed(2),r.created_at,r.original_no||'—'].forEach(function(v){$('<td>').text(v).appendTo(tr);});tr.appendTo('#trades');});$('#detailCount').text('第'+dp+'页，共'+dt+'条');$('#audit').empty();d.audit.forEach(function(a){var x=$('<details>');$('<summary>').text(a.created_at+' · '+(actions[a.action]||a.action)+' · 操作人 '+a.actor_id).appendTo(x);$('<pre>').text(a.detail).appendTo(x);x.appendTo('#audit');});if(!document.getElementById('detail').open)document.getElementById('detail').showModal(); }).fail(fail);}
function loadCategories(selected){return $.getJSON(base+'/categories').done(function(rows){categories={};rows.forEach(function(r){categories[r.code]=r.name;});var search=$('#search [name=category]'),edit=$('#save [name=category]'),oldSearch=search.val(),oldEdit=selected||edit.val();search.empty().append($('<option>').val('').text('全部类型'));edit.empty();rows.forEach(function(r){search.append($('<option>').val(r.code).text(r.name));if(r.code!=='SYSTEM')edit.append($('<option>').val(r.code).text(r.name));});search.val(oldSearch||'');edit.val(oldEdit||'CATERING');});}
function addCategory(){var name=prompt('请输入新增商户类型名称（不超过40字）');if(!name)return;$.post(base+'/category',{name:name,token:token}).done(function(r){loadCategories(r.code);}).fail(fail);}
function clearPhoto(key){$('#save [name='+key+']').val('');$('#preview-'+key).removeAttr('src').prop('hidden',true);}
function uploadPhoto(input,key){if(!input.files.length)return;var file=input.files[0];if(file.size>3*1024*1024){alert('图片不能超过3MB');input.value='';return;}var data=new FormData();data.append('file',file);data.append('token',token);uploading++;$('#saveButton').prop('disabled',true);$.ajax({url:base+'/upload',type:'POST',data:data,processData:false,contentType:false}).done(function(r){$('#save [name='+key+']').val(r.id);$('#preview-'+key).attr('src',base+'/image/'+r.id).prop('hidden',false);}).fail(fail).always(function(){input.value='';uploading--;$('#saveButton').prop('disabled',uploading>0);});}
loadCategories().done(load).fail(fail);
</script></body></html>
